site_name: Cloud Pak Production Deployment Guides
site_description: >-
  The Cloud Pak Production Deployment Guides document and demonstrate how to run cloud-native solutions leveraging IBM Cloud Pak capabilities in a Red Hat OpenShift environment
#site_url: https://pages.github.ibm.com/cloudpakbringup/production-deployment-guides/
#site_url: https://pages.github.ibm.com/
site_url: ""
site_author: Cloud Pak Production Deployment Guides development team
repo_name: ""
repo_url: https://github.com/ncolon/production-deployment-guides
docs_dir: docs
site_dir: public
edit_uri: edit/master/docs
theme:
    name: material
    logo: images/cloudnativetoolkit.png
    favicon: images/cloudnativetoolkit.png
    palette:
      scheme: default
      primary: black
    font:
      text: IBM Plex Sans
      code: IBM Plex Mono
    language: en
    custom_dir: overrides
    features:
#      - navigation.tabs
      - navigation.instant
      - navigation.tracking
#      - navigation.tabs.sticky
#      - navigation.top
use_directory_urls: true
plugins:
  - mkdocs-video
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs/snippets
extra_css:
    - css/extra.css
    - css/toolkit-code.css
extra:
  generator: false
  analytics:
    provider: google
    property: G-Q0FLL49YN3

copyright: Copyright © 2021 Cloud Pak Production Deployment Guides
